<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistema de Clientes
    </title>

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- SWEET ALERT -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./assets/css/styles.css"
    >

</head>

<body>

    <!-- ===================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- LOGO -->

        <div class="sidebar-header">

            <div class="logo-box">

                <i class="bi bi-people-fill"></i>

            </div>

            <div>

                <h3 class="logo-title">
                    proyectoRDC
                </h3>

            </div>

        </div>

        <!-- MENU -->

        <nav class="sidebar-menu">

            <button
                class="menu-link active"
                data-page="clientes"
            >

                <i class="bi bi-person-lines-fill"></i>

                <span>
                    Clientes
                </span>

            </button>

            <button
                class="menu-link"
                data-page="estadisticas"
            >

                <i class="bi bi-bar-chart-fill"></i>

                <span>
                    Estadísticas
                </span>

            </button>

            <button
                class="menu-link"
                data-page="configuracion"
            >

                <i class="bi bi-gear-fill"></i>

                <span>
                    Configuración
                </span>

            </button>

            <button
                class="menu-link"
                data-page="ayuda"
            >

                <i class="bi bi-question-circle-fill"></i>

                <span>
                    Ayuda
                </span>

            </button>

        </nav>

    </aside>

    <!-- ===================================== -->
    <!-- MAIN -->
    <!-- ===================================== -->

    <main
        class="main-content"
        id="mainContent"
    >

        <!-- TOPBAR -->

        <header class="topbar">

            <!-- LEFT -->

            <div class="topbar-left">

                <button
                    id="toggleSidebar"
                    class="toggle-btn"
                >

                    <i class="bi bi-list"></i>

                </button>

                <h2 id="pageTitle">

                    Clientes

                </h2>

            </div>

            <!-- RIGHT -->

            <div class="topbar-right">

                <div class="clock-container">

                    <i class="bi bi-clock-fill"></i>

                    <span id="clock">

                        00:00:00

                    </span>

                </div>

            </div>

        </header>

        <!-- CONTENT -->

        <div
            id="content"
            class="page-content"
        ></div>

    </main>

    <!-- ===================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================== -->

    <script
        type="module"
        src="./assets/js/app.js"
    ></script>

    <!-- SIDEBAR SCRIPT -->

    <script>

        const toggleBtn =
            document.getElementById(
                "toggleSidebar"
            );

        const sidebar =
            document.getElementById(
                "sidebar"
            );

        const mainContent =
            document.getElementById(
                "mainContent"
            );

        toggleBtn.addEventListener(
            "click",
            () => {

                sidebar.classList.toggle(
                    "collapsed"
                );

                mainContent.classList.toggle(
                    "expanded"
                );
            }
        );

        /* ACTIVE MENU */

        const links =
            document.querySelectorAll(
                ".menu-link"
            );

        links.forEach(link => {

            link.addEventListener(
                "click",
                () => {

                    links.forEach(l => {

                        l.classList.remove(
                            "active"
                        );
                    });

                    link.classList.add(
                        "active"
                    );
                }
            );
        });

    </script>

</body>

</html>
